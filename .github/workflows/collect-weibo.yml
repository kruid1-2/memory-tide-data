name: MEMORY TIDE - Collect Weibo
run-name: Weibo ${{ inputs.trigger_source || github.event_name }} ${{ inputs.dispatch_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Dispatch source (manual / cloudflare-cron / cloudflare-probe)
        type: choice
        options: [manual, cloudflare-cron, cloudflare-probe]
        default: manual
      scheduled_at:
        description: UTC 15-minute window start (Cloudflare only)
        type: string
        default: ''
      dispatched_at:
        description: Worker actual dispatch time UTC (Cloudflare only)
        type: string
        default: ''
      dispatch_id:
        description: Stable window dispatch identity (Cloudflare only)
        type: string
        default: ''
  schedule:
    # Every 15 minutes (UTC). Shifted one minute on 2026-10-13 to refresh
    # GitHub schedule registration after no schedule events were delivered.
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: memory-tide-weibo-data-writer
  cancel-in-progress: false

jobs:
  collect:
    # First validate manual dispatch. Set this repository variable to true afterwards.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || vars.WEIBO_SCHEDULE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_DIR: ${{ github.workspace }}/_data-store
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout collection code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test reusable cleaning and collection behavior
        working-directory: memory-tide-data
        run: |
          python3 -m unittest discover -s tests -p 'test_live_collection.py' -v
          python3 -m unittest discover -s tests -p 'test_scheduler_gate.py' -v

      - name: Restore persistent data branch
        run: bash memory-tide-data/deployment/restore_data.sh

      - name: Collect genuine current data
        id: collect
        continue-on-error: true
        working-directory: memory-tide-data
        env:
          OUTBOX_DIR: ${{ github.workspace }}/_collection-outbox
        run: python3 deployment/scheduled_collect.py

      - name: Verify saved response and last successful snapshot
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        working-directory: memory-tide-data
        run: python3 -m memory_tide.live verify --root "$DATA_DIR/observations" --last-only

      - name: Persist snapshots or failure log to GitHub
        id: persist
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        continue-on-error: true
        run: bash memory-tide-data/deployment/persist_data.sh

      - name: Backup newly collected files if push failed
        if: ${{ always() && steps.collect.outcome != 'skipped' && steps.persist.outcome != 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: weibo-unsaved-${{ github.run_id }}-${{ github.run_attempt }}
          path: _collection-outbox/
          if-no-files-found: warn
          retention-days: 14

      - name: Write collection status summary
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: python3 memory-tide-data/deployment/run_summary.py

      - name: Fail visibly when collection or persistence failed
        if: ${{ always() && (steps.collect.outcome == 'failure' || steps.persist.outcome == 'failure') }}
        run: exit 1
